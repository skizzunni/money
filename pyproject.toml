[project]
name = "mnqbot"
version = "0.1.0"
description = "MNQ liquidity-sweep strategy with prop-firm risk rails and a pessimistic backtester"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.5", "pynescript>=0.2"]

[project.scripts]
mnqbot = "mnqbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mnqbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the .pine scripts through the interpreter (first run parses them, ~2 min)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E741"]  # l = lows, as in every OHLC codebase
